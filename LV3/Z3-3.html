<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Z3-3</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
  <svg id="svg" width="600" height="400" style="border:1px solid #ccc"></svg>
  <script>
    const widthSVG = 600, heightSVG = 400;
    const widthRect = 80, heightRect = 60;

    const svg = d3.select("#svg");

    const rect = svg.append("rect")
      .attr("width", widthRect)
      .attr("height", heightRect)
      .attr("fill", "tomato")
      .attr("transform", `translate(${widthSVG - widthRect}, ${heightSVG - heightRect})`);

    rect.transition()
      .duration(1000)
      .attr("transform", `translate(0, ${heightSVG - heightRect})`)
      .transition()
      .duration(1000)
      .attr("transform", `translate(0, 0)`);
  </script>
</body>
</html>
