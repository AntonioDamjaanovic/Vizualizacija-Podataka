<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Z4-3</title>
  <script src="https://d3js.org/d3.v3.min.js"></script>
</head>

<body>
  <p>Otvori konzolu (F12) i klikni / pređi mišem preko isječka pite.</p>
  <script>
    var width = 500;
    var height = 500;
    var outerRadius = 200;
    var innerRadius = 0;

    var color = d3.scale.category20();

    var arc = d3.svg.arc()
        .innerRadius(innerRadius)
        .outerRadius(outerRadius);

    var data = [
        {name: 'jabuka', value: 17},
        {name: 'kruska', value: 4},
        {name: 'banana', value: 83},
        {name: 'jagoda', value: 47},
        {name: 'ribizla', value: 1}
    ];

    var pie = d3.layout.pie()
        .value(function(d) { return d.value; });

    var svg = d3.select("body")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

    var pieArcs = svg.selectAll("g.pie")
        .data(pie(data))
        .enter()
        .append("g")
        .attr("class", "pie")
        .attr("transform", "translate(" + (width / 2) + ", " + (height / 2) + ")");

    pieArcs.append("path")
        .attr("fill", function(d, i) { return color(i); })
        .attr("d", arc)
        .on("click", function(d) {
            console.log("click -> ime: " + d.data.name + ", kolicina: " + d.data.value);
        })
        .on("mouseover", function(d) {
            console.log("mouseover -> ime: " + d.data.name + ", kolicina: " + d.data.value);
            d3.select(this).attr("stroke", "black").attr("stroke-width", 2);
        })
        .on("mouseout", function(d) {
            d3.select(this).attr("stroke", "none");
        });

    pieArcs.append("text")
        .attr("transform", function(d) { return "translate(" + arc.centroid(d) + ")"; })
        .attr("text-anchor", "middle")
        .text(function(d) { return d.data.name + ": " + d.value; });
  </script>
</body>
</html>
